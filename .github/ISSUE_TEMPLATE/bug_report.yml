name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what did you see instead?
    validations: { required: true }
  - type: input
    id: where
    attributes:
      label: Where?
      description: The address of the page, or "local install"
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari on iPhone 15, Chrome 130 on Linux …
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Please remove anything private (names, photos, tokens) first.
