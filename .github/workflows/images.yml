name: Docker images

# The AI and face images are large (PyTorch, models), so they are built only when their files change, and weekly to catch new vulnerabilities.
on:
  push:
    branches: [main]
    paths: ['tools/clip/**', 'tools/faces/**', 'Dockerfile.web', '.github/workflows/images.yml']
  pull_request:
    paths: ['tools/clip/**', 'tools/faces/**', 'Dockerfile.web']
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-scan:
    name: Build and scan ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web,  context: .,            file: Dockerfile.web }
          - { name: clip, context: tools/clip,   file: tools/clip/Dockerfile }
          - { name: face, context: tools/faces,  file: tools/faces/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          tags: syt-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: "Scan the image (report only, the Mono base image is old)"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: syt-${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
